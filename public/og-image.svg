<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grad)"/>
  
  <!-- Logo area -->
  <rect x="50" y="50" width="100" height="100" rx="20" fill="#3b82f6"/>
  <text x="100" y="110" font-size="60" text-anchor="middle" fill="white">📚</text>
  
  <!-- Main title -->
  <text x="50" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white">Training Storybook</text>
  
  <!-- Subtitle -->
  <text x="50" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="#60a5fa">INSURACTIO</text>
  
  <!-- Description -->
  <text x="50" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="rgba(255, 255, 255, 0.8)">Solution professionnelle de visualisation</text>
  <text x="50" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="32" fill="rgba(255, 255, 255, 0.8)">interactive de documents PDF</text>
  
  <!-- Features -->
  <rect x="50" y="510" width="240" height="45" rx="8" fill="rgba(59, 130, 246, 0.3)"/>
  <text x="65" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="white">🎯 Effet Page Tournée</text>
  
  <rect x="305" y="510" width="160" height="45" rx="8" fill="rgba(59, 130, 246, 0.3)"/>
  <text x="320" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="white">🤖 Analyse IA</text>
  
  <rect x="480" y="510" width="150" height="45" rx="8" fill="rgba(59, 130, 246, 0.3)"/>
  <text x="495" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="white">📱 QR Codes</text>
  
  <rect x="645" y="510" width="180" height="45" rx="8" fill="rgba(59, 130, 246, 0.3)"/>
  <text x="660" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="white">🔓 Open Source</text>
  
  <!-- Footer -->
  <text x="1150" y="590" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="rgba(255, 255, 255, 0.5)" text-anchor="end">storybook.insuractio.com</text>
</svg>
